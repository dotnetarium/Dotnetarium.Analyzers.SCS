# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: BuildTest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
      
    - name: Build
      run: dotnet build DotnetariumSCS/DotnetariumSCS.csproj --configuration Release

    - name: Test modern .NET sinks
      run: dotnet run --project tests/ModernSinkSmoke/ModernSinkSmoke.csproj --configuration Release

    - name: Test Razor and Blazor taint flows
      shell: pwsh
      run: ./tests/RazorSmoke/Test.ps1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        retention-days: 7
        name: packages
        path: |
          ./DotnetariumSCS/bin/Release/**/*.nupkg
